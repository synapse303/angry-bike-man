<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Angry Bike Man</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Arial Black",Impact,sans-serif}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#ctl{display:none}
.btn{position:absolute;border-radius:50%;background:rgba(255,255,255,.16);border:.5vh solid rgba(255,255,255,.55);color:#fff;font-size:3.6vh;display:flex;align-items:center;justify-content:center;text-shadow:0 0 4px #000;box-sizing:border-box}
.btn.on,.arrow.on{background:rgba(255,215,0,.5)}
#steer{position:absolute;left:0;bottom:0;width:42vw;height:55vh}
.arrow{position:absolute;bottom:5vh;width:19vh;height:19vh;border-radius:50%;background:rgba(255,255,255,.16);border:.5vh solid rgba(255,255,255,.55);color:#fff;font-size:8vh;display:flex;align-items:center;justify-content:center;box-sizing:border-box;pointer-events:none}
#la{left:3vw}#ra{left:calc(3vw + 22vh)}
#gas{right:3vw;bottom:5vh;width:23vh;height:23vh;background:rgba(0,200,90,.3);font-size:6vh}
#brake{right:calc(3vw + 26vh);bottom:4vh;width:17vh;height:17vh;background:rgba(230,40,40,.3)}
#horn{right:5vw;bottom:32vh;width:14vh;height:14vh;font-size:3vh;background:rgba(255,150,0,.3)}
#tog{position:absolute;top:2vh;right:2vw;display:flex;gap:1.5vw;z-index:5}
#tog div{width:9vh;height:9vh;border-radius:2vh;background:rgba(0,0,0,.45);border:.4vh solid rgba(255,255,255,.5);color:#fff;font-size:4.5vh;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#tog div.off{opacity:.35;text-decoration:line-through}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ctl">
  <div id="steer"><div class="arrow" id="la">&#9664;</div><div class="arrow" id="ra">&#9654;</div></div>
  <div class="btn" id="brake">BRAKE</div>
  <div class="btn" id="gas">GO</div>
  <div class="btn" id="horn">HONK</div>
</div>
<div id="tog"><div id="mus">&#9835;</div><div id="voi">&#128483;</div></div>
<script>
'use strict';
// ================= utils =================
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mod=(a,n)=>((a%n)+n)%n, pick=a=>a[Math.random()*a.length|0];
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,1.6);W=Math.floor(innerWidth*DPR);H=Math.floor(innerHeight*DPR);cv.width=W;cv.height=H;}
addEventListener('resize',resize);resize();

// ================= constants =================
const SEG=200, ROADW=2000, CAM_H=1000, CAM_DEPTH=1/Math.tan(50*Math.PI/180), DRAW=230, RUMBLE=6;
const PLAYER_DIST=1600, MAXSPD=SEG*60;
const CAR_LEN=2000, CAR_HW=0.22, BIKE_HW=0.07, BIKE_LEN=900, HEDGE_X=1.32, HEDGE_H=0.33;
const COL={grass1:'#2f5d3b',grass2:'#2a5536',road1:'#4c4858',road2:'#48445300',road2b:'#474353',kerb1:'#77727f',kerb2:'#6a6572',line:'#ece7f2',hedge1:'#1d4426',hedge2:'#1a3e23',hedgeTop:'#2a5e33'};
const CAR_COLS=['#2e86de','#f6b93b','#e5e5e5','#38ada9','#8e44ad','#2d3436','#e15f41','#78e08f','#c0392b','#f8c291'];

// ================= road =================
let segs=[],trackLen=0;const vis=[];
const lastY=()=>segs.length?segs[segs.length-1].p2.world.y:0;
function addSeg(curve,y){const n=segs.length;segs.push({index:n,p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},p2:{world:{y:y,z:(n+1)*SEG},camera:{},screen:{}},curve,sprites:[],hedgeL:true,hedgeR:true});}
const easeIn=(a,b,p)=>a+(b-a)*p*p, easeIO=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
function addRoad(e,h,l,curve,y){const sy=lastY(),ey=sy+y*SEG,t=e+h+l;let n;
  for(n=0;n<e;n++)addSeg(easeIn(0,curve,n/e),easeIO(sy,ey,n/t));
  for(n=0;n<h;n++)addSeg(curve,easeIO(sy,ey,(e+n)/t));
  for(n=0;n<l;n++)addSeg(easeIO(curve,0,n/l),easeIO(sy,ey,(e+h+n)/t));}
function buildRoad(){
  segs=[];addRoad(50,120,50,0,0);
  for(let i=0;i<40;i++){const L=pick([25,40,60]);const c=Math.random()<0.3?0:rand(-4.5,4.5)*(Math.random()<.5?.5:1);const h=Math.random()<0.35?0:rand(-22,22);addRoad(L,L,L,c,h);}
  addRoad(60,60,60,0,-lastY()/SEG);addRoad(30,60,30,0,0);
  trackLen=segs.length*SEG;
  for(const s of segs){const i=s.index;
    if(i%420<26)s.hedgeL=false; if((i+210)%420<26)s.hedgeR=false;
    if(i%8===0)s.sprites.push({t:'tree',o:-rand(1.6,3.4),v:Math.random()});
    if((i+4)%9===0)s.sprites.push({t:'tree',o:rand(1.6,3.4),v:Math.random()});
    if(i%55===20)s.sprites.push({t:'pole',o:1.45});
    if(i%420===13)s.sprites.push({t:'cottage',o:-2.3,v:Math.random()});
    if((i+210)%420===13)s.sprites.push({t:'cottage',o:2.4,v:Math.random()});
    if(i%600===300)s.sprites.push({t:'sign',o:-1.15});
  }
}
buildRoad();

// city skyline (Streets-of-Rage dusk)
const SKY=[];(function(){let x=0;while(x<2){const w=rand(.015,.045),h=rand(.03,.16);const win=[];for(let k=0;k<Math.floor(h*90);k++)if(Math.random()<.35)win.push([Math.random(),Math.random()]);SKY.push({x,w,h,win});x+=w+rand(0,.01);}})();

// ================= state =================
let state='title',paused=false,G,player,bike,cars=[],objs=[],skyOff=0,lastShout='',tNow=0;
const tch={l:false,r:false,gas:false,brake:false},kb={};
let musicOn=store.get('abm_music','1')==='1',voiceOn=store.get('abm_voice','1')==='1';

const LINES={
 insult:["OI! YOU B*LLEND!","GET BACK, YOU PILLOCK!","W*NKER!","WATCH IT, YOU T*SSER!","I'M FILMING THIS, YOU MUPPET!","S*D OFF!","BL**DY CAR DRIVERS!","YOU ABSOLUTE WEAPON!","P*SS OFF!","GIT!","B*GGER OFF!","I'VE GOT A GOPRO, MATE!","SHARE THE ROAD, KN*BHEAD!","D*CKHEAD!","YOU UTTER PLONKER!","THIS IS MY STRAVA SEGMENT!","ARE YOU BLIND, YOU NUMPTY?!","OUT OF IT, A*SEHOLE!","READ THE HIGHWAY CODE, MORON!","BL**DY HELL!"],
 close:["BACK OFF!","STOP TAILGATING, YOU PRAT!","I CAN HEAR YOUR ENGINE, MUPPET!","DON'T EVEN THINK ABOUT IT!","ONE POINT FIVE METRES, NUMPTY!","NOT TODAY, SUNSHINE!","YOU'RE NOT GETTING PAST, TW*T!"],
 along:["TOO CLOSE, YOU MANIAC!","ARE YOU TRYING TO KILL ME?!","YOU BL**DY LUNATIC!","I'LL HAVE YOUR WING MIRROR!","GET OFF MY LANE, W*NKER!","SH*THEAD!"],
 honk:["DON'T YOU HONK AT ME!","HONK AGAIN, I DARE YOU!","YEAH, AND YOUR MUM!","BEEP THIS, YOU T*SSER!","OH, VERY BRAVE!"],
 passed:["COME BACK HERE, YOU COWARD!","SEE YOU AT THE LIGHTS!","I'VE GOT YOUR REG NUMBER!","I'M REPORTING YOU!","ROAD HOG!","B*STARD!"],
 knocked:["MY CARBON FRAME!!","I'M CALLING MY SOLICITOR!","THAT'S GOING ON YOUTUBE!","ARGH! MY LYCRA!"],
 thrown:["HAVE SOME OF THIS!","CATCH, YOU W*NKER!","EAT MY BIDON!","SPECIAL DELIVERY!","TAKE THAT, T*SSER!","PRESENT FOR YOU, D*CKHEAD!"]
};

function newGame(){
  G={splat:null,skid:0,skidDir:1,score:0,lives:3,level:1,overtakes:0,msg:'',msgT:0,crashT:0,crashType:'',nextCar:3,time:0,shake:0,flash:0,best:+store.get('abm_best','0'),newBest:false,hornCD:0,bumpCD:0,overT:0};
  player={x:-0.5,prevX:-0.5,z:0,speed:MAXSPD*0.3,steerVis:0};
  cars=[];objs=[];resetBike(15000);
}
function resetBike(ahead){
  const L=G.level;
  bike={z:player.z+ahead,x:-0.5,target:-0.5,home:-0.55,base:MAXSPD*Math.min(0.52,0.3+0.025*(L-1)),speed:0,
    k:Math.min(0.86,0.6+0.045*(L-1)),react:Math.min(5.5,2.8+0.45*(L-1)),shoutT:1.2,throwT:rand(4,6),bubble:null,passed:false,fallen:false,fallT:0,fallDir:-1,ph:0,calm:0,wob:0};
  bike.speed=bike.base;
}
newGame();

function showMsg(t,d){G.msg=t;G.msgT=d||1.8;}
function shout(pool){let t,i=0;do{t=pick(pool);i++}while(t===lastShout&&i<8);lastShout=t;bike.bubble={text:t,t:2.3,age:0};speak(t);}

// ================= update =================
const segAt=z=>segs[Math.floor(mod(z,trackLen)/SEG)%segs.length];
function update(dt){
  G.time+=dt;tNow+=dt;
  if(G.msgT>0)G.msgT-=dt; G.shake=Math.max(0,G.shake-dt*2.2); G.flash=Math.max(0,G.flash-dt*2.5);
  G.hornCD-=dt;G.bumpCD-=dt;
  const pseg=segAt(player.z),spd=player.speed/MAXSPD;
  skyOff+=pseg.curve*spd*dt*0.06;
  if(bike.bubble){bike.bubble.t-=dt;bike.bubble.age+=dt;if(bike.bubble.t<=0)bike.bubble=null;}
  if(state==='title'){attract(dt);engine(spd,false);return;}
  if(state==='over'){G.overT+=dt;fallAnim(dt);engine(0,false);return;}
  if(state==='crash'){G.crashT-=dt;fallAnim(dt);engine(0,false);if(G.crashT<=0)afterCrash();return;}
  // ---- play ----
  const L=tch.l||kb.left,R=tch.r||kb.right,GAS=tch.gas||kb.gas,BRK=tch.brake||kb.brake;
  player.prevX=player.x;
  const steer=(L?-1:0)+(R?1:0);
  player.x+=steer*dt*(0.7+1.3*spd)*(G.skid>0?0.35:1);
  if(G.skid>0){G.skid-=dt;player.x+=G.skidDir*dt*(0.9+Math.sin(G.time*14)*0.8);player.steerVis=Math.sin(G.time*18);}
  player.x-=dt*2*spd*spd*pseg.curve*0.11;
  player.steerVis=lerp(player.steerVis,steer,Math.min(1,dt*8));
  if(GAS)player.speed+=MAXSPD*0.42*dt;else if(BRK)player.speed-=MAXSPD*1.1*dt;else player.speed-=MAXSPD*0.1*dt;
  player.onVerge=Math.abs(player.x)>0.95;
  if(player.onVerge&&spd>0.35)player.speed-=MAXSPD*0.6*dt;
  if(Math.abs(player.x)>1.08){player.x=Math.sign(player.x)*1.08;if(spd>0.2&&G.bumpCD<=0){sfxBump();player.speed*=0.85;G.shake=0.35;G.bumpCD=0.5;}}
  player.speed=clamp(player.speed,0,MAXSPD);
  player.z+=player.speed*dt;
  G.score+=player.speed*dt*0.0015;
  player.braking=BRK;player.gas=GAS;
  updateBike(dt);updateObjs(dt);updateCars(dt,false);checkCollisions();
  engine(player.speed/MAXSPD,true,GAS);
}
function attract(dt){
  player.prevX=player.x;player.speed=MAXSPD*0.42;player.z+=player.speed*dt;player.x=-0.5+Math.sin(G.time*0.4)*0.06;
  bike.z=player.z+5200;bike.ph+=player.speed*dt*0.0016;bike.x=-0.52+Math.sin(G.time*0.9)*0.04;
  bike.shoutT-=dt;if(bike.shoutT<=0){bike.bubble={text:pick(LINES.insult),t:2.2,age:0};bike.shoutT=rand(3,5);}
  updateCars(dt,true);
}
function updateBike(dt){
  const b=bike,rel=b.z-player.z;
  const along=Math.abs(rel)<CAR_LEN*1.5;
  let target=b.base*(1+0.07*Math.sin(G.time*0.9));
  if(G.level>=3&&along&&!b.passed)target*=1.2; // he races you
  if(b.calm>0){b.calm-=dt;target*=0.85;}
  b.speed=lerp(b.speed,target,Math.min(1,dt*1.5));
  b.z+=b.speed*dt;b.ph+=b.speed*dt*0.0016;
  const engaged=!b.passed&&rel>-CAR_LEN*1.2&&rel<12000;
  if(engaged)b.target+=(player.x-player.prevX)*b.k;   // HE MOVES WHEN YOU MOVE
  b.target+=(b.home-b.target)*Math.min(1,dt*0.25);
  if(b.calm>0)b.target+=Math.sin(G.time*13)*dt*0.5;
  b.target=clamp(b.target,-0.92,0.75);
  b.x+=(b.target-b.x)*Math.min(1,dt*b.react)+Math.sin(G.time*3.1)*0.0012;
  if(G.level>=4&&engaged&&!along&&rel>2500&&rel<9000){b.throwT-=dt;if(b.throwT<=0){throwObj();b.throwT=Math.max(2.2,rand(7,10)-(G.level-4)*0.9);}}
  b.shoutT-=dt;
  if(engaged&&rel<7500&&b.shoutT<=0){shout(Math.abs(rel)<CAR_LEN*1.2?LINES.along:rel<3000?LINES.close:LINES.insult);b.shoutT=rand(1.5,3.1);}
  if(!b.passed&&-rel>CAR_LEN*0.55+BIKE_LEN*0.5){
    b.passed=true;G.overtakes++;const pts=1000*G.level;G.score+=pts;
    showMsg('OVERTAKEN! +'+pts,2);sfxPass();shout(LINES.passed);G.level++;
  }
  if(b.passed&&-rel>PLAYER_DIST+3500){resetBike(30000);setTimeout(()=>{if(state==='play')showMsg(G.level===4?'LEVEL 4 — HE\'S THROWING STUFF NOW!':'LEVEL '+G.level+' — HE\'S ANGRIER!',2.2)},300);}
}
function updateCars(dt,quiet){
  G.nextCar-=dt;
  const spawnZ=player.z+DRAW*SEG*0.93;
  if(G.nextCar<=0){
    if(!cars.some(c=>Math.abs(c.z-spawnZ)<6000)){const bx=0.5+rand(-0.07,0.07);cars.push({z:spawnZ,x:bx,base:bx,speed:MAXSPD*rand(0.35,0.55),col:pick(CAR_COLS),honked:false,scored:false,flash:0});}
    G.nextCar=rand(1.4,3.4)/(1+0.17*(G.level-1));
  }
  for(const c of cars){
    c.z-=c.speed*dt;
    let tx=c.base;if(Math.abs(c.z-bike.z)<5000&&bike.x>0.1&&!bike.fallen)tx=Math.min(0.92,bike.x+0.33);
    c.x+=(tx-c.x)*Math.min(1,dt*2.5);c.flash=Math.max(0,c.flash-dt);
    if(quiet)continue;
    const rel=c.z-player.z;
    if(!c.honked&&rel<15000&&rel>0&&Math.abs(c.x-player.x)<0.45){c.honked=true;c.flash=0.9;sfxCarHorn();}
    if(!c.scored&&rel<-CAR_LEN){c.scored=true;if(Math.abs(c.x-player.x)<0.62){const p=250*G.level;G.score+=p;showMsg('CLOSE ONE! +'+p,1.2);sfxWhoosh();}}
  }
  cars=cars.filter(c=>c.z>player.z-PLAYER_DIST-2500);
}
const THROW_POOL={4:['bottle','gel'],5:['bottle','gel','banana'],6:['bottle','gel','banana','pump','lock']};
function throwObj(){const pool=THROW_POOL[Math.min(6,G.level)];
  objs.push({type:pick(pool),z:bike.z,x:bike.x,tx:player.x+rand(-0.12,0.12),h:0.42,vh:rand(0.65,0.95),vz:bike.speed*0.15,landed:false,rot:0,hit:false});
  shout(LINES.thrown);bike.shoutT=2.5;sfxThrow();}
function updateObjs(dt){
  for(const o of objs){
    if(!o.landed){o.z+=o.vz*dt;o.x+=(o.tx-o.x)*Math.min(1,dt*1.6);o.vh-=2.2*dt;o.h+=o.vh*dt;o.rot+=dt*11;if(o.h<=0){o.h=0;o.landed=true;o.rot=o.type==='banana'?0.3:Math.PI/2;sfxBump();}}
    if(o.hit)continue;
    if(Math.abs(o.z-player.z)<CAR_LEN*0.55&&Math.abs(o.x-player.x)<CAR_HW+0.06&&o.h<0.5){
      o.hit=true;
      if(!o.landed){G.splat=makeSplat(o.type);player.speed*=0.75;G.shake=0.6;sfxSmash();showMsg({bottle:'SPLASH!',gel:'GEL SPLAT!',banana:'BANANA\'D!',pump:'SMASH!',lock:'CRACK!'}[o.type],1.3);}
      else if(o.type==='banana'){G.skid=1.0;G.skidDir=Math.random()<.5?-1:1;player.speed*=0.8;sfxSkid();showMsg('BANANA SKID!',1.3);}
      else{player.speed*=0.85;G.shake=0.3;sfxBump();showMsg('CLUNK!',1);}
      G.score=Math.max(0,G.score-100);
    }
  }
  objs=objs.filter(o=>o.z>player.z-PLAYER_DIST-1500);
  if(G.splat){G.splat.t-=dt;if(G.splat.t<=0)G.splat=null;}
}
function makeSplat(type){const col={bottle:'rgba(150,210,255,',gel:'rgba(80,220,90,',banana:'rgba(250,220,80,',pump:null,lock:null}[type];
  const cx=W*rand(0.3,0.7),cy=H*rand(0.3,0.55),blobs=[],cracks=[];
  if(col){for(let i=0;i<18;i++){const a=Math.random()*6.28,r=Math.pow(Math.random(),1.5)*H*0.28;blobs.push([cx+Math.cos(a)*r*1.4,cy+Math.sin(a)*r,H*rand(0.03,0.12)*(1-r/(H*0.35))]);}}
  else{for(let i=0;i<11;i++){const a=i/11*6.28+rand(-.2,.2),pts=[[cx,cy]];let x=cx,y=cy;for(let k=0;k<4;k++){x+=Math.cos(a+rand(-.4,.4))*H*rand(.06,.14);y+=Math.sin(a+rand(-.4,.4))*H*rand(.06,.14);pts.push([x,y]);}cracks.push(pts);}}
  return {t:3.5,col,blobs,cracks,cx,cy};}
function drawSplat(){const sp=G.splat;if(!sp)return;const a=Math.min(1,sp.t/1.2);
  if(sp.col){for(const b of sp.blobs){ctx.fillStyle=sp.col+(0.75*a)+')';ell(b[0],b[1],b[2]*1.2,b[2]);}ctx.fillStyle='rgba(255,255,255,'+(0.5*a)+')';for(const b of sp.blobs)ell(b[0]-b[2]*0.3,b[1]-b[2]*0.3,b[2]*0.25,b[2]*0.18);}
  else{ctx.strokeStyle='rgba(255,255,255,'+(0.85*a)+')';ctx.lineWidth=Math.max(1.5,H*0.004);for(const c of sp.cracks){ctx.beginPath();ctx.moveTo(c[0][0],c[0][1]);for(const q of c)ctx.lineTo(q[0],q[1]);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,'+(0.35*a)+')';ell(sp.cx,sp.cy,H*0.03,H*0.03);for(let r=1;r<3;r++){ctx.beginPath();ctx.arc(sp.cx,sp.cy,H*0.07*r,0,6.28);ctx.stroke();}}}
function drawObj(x,y,u,o){const s=u*0.07;if(s<1.5)return;
  ctx.fillStyle='rgba(0,0,0,.35)';ell(x,y,s*0.8,s*0.2);
  ctx.save();ctx.translate(x,y-o.h*u-s*0.5);ctx.rotate(o.rot);
  if(o.type==='bottle'){ctx.fillStyle='#4fb3ff';rr(-s*0.3,-s*0.9,s*0.6,s*1.8,s*0.2);ctx.fillStyle='#fff';ctx.fillRect(-s*0.3,-s*0.2,s*0.6,s*0.35);ctx.fillStyle='#111';ctx.fillRect(-s*0.18,-s*1.15,s*0.36,s*0.28);}
  else if(o.type==='gel'){ctx.fillStyle='#2ecc71';rr(-s*0.45,-s*0.6,s*0.9,s*1.2,s*0.1);ctx.fillStyle='#fff';ctx.fillRect(-s*0.3,-s*0.15,s*0.6,s*0.25);}
  else if(o.type==='banana'){ctx.strokeStyle='#f7d038';ctx.lineWidth=s*0.45;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,-s*0.6,s*0.9,0.4,2.7);ctx.stroke();ctx.fillStyle='#5a3a10';ell(Math.cos(0.4)*s*0.9,-s*0.6+Math.sin(0.4)*s*0.9,s*0.15,s*0.15);}
  else if(o.type==='pump'){ctx.fillStyle='#222';rr(-s*0.2,-s*1.1,s*0.4,s*2.2,s*0.15);ctx.fillStyle='#bbb';ctx.fillRect(-s*0.2,-s*0.2,s*0.4,s*0.4);}
  else if(o.type==='lock'){ctx.strokeStyle='#c9c9c9';ctx.lineWidth=s*0.25;ctx.beginPath();ctx.arc(0,-s*0.2,s*0.6,Math.PI,0);ctx.lineTo(s*0.6,s*0.5);ctx.moveTo(-s*0.6,-s*0.2);ctx.lineTo(-s*0.6,s*0.5);ctx.stroke();ctx.fillStyle='#d32f2f';rr(-s*0.8,s*0.3,s*1.6,s*0.45,s*0.1);}
  ctx.restore();}
function checkCollisions(){

let AC=null,master,musicBus,sfxBus,noiseBuf,pulseWave,distCurve,leadIn,engOsc,engOsc2,engGain,engFilt;
const BPM=150,STEP=60/BPM/4;let mStep=0,nextT=0;
function ensureAudio(){
  if(!AC){
    try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;comp.connect(AC.destination);
    master=AC.createGain();master.gain.value=0.9;master.connect(comp);
    musicBus=AC.createGain();musicBus.gain.value=musicOn?0.5:0;musicBus.connect(master);
    sfxBus=AC.createGain();sfxBus.gain.value=0.85;sfxBus.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);let hold=0;for(let i=0;i<d.length;i++){if(i%3===0)hold=Math.random()*2-1;d[i]=hold;} // crunchy 8-bit noise
    const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)re[k]=2*Math.sin(k*Math.PI*0.25)/(k*Math.PI);pulseWave=AC.createPeriodicWave(re,im);
    distCurve=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;distCurve[i]=Math.tanh(x*6);}
    leadIn=AC.createGain();leadIn.connect(musicBus);const dl=AC.createDelay(1);dl.delayTime.value=STEP*3;const fb=AC.createGain();fb.gain.value=0.3;const wet=AC.createGain();wet.gain.value=0.35;
    leadIn.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(musicBus);
    engOsc=AC.createOscillator();engOsc.type='sawtooth';engOsc2=AC.createOscillator();engOsc2.type='square';engFilt=AC.createBiquadFilter();engFilt.type='lowpass';engFilt.frequency.value=500;
    engGain=AC.createGain();engGain.gain.value=0;engOsc.connect(engFilt);engOsc2.connect(engFilt);engFilt.connect(engGain);engGain.connect(sfxBus);engOsc.start();engOsc2.start();
    nextT=AC.currentTime+0.1;setInterval(sched,25);setTimeout(preloadVoice,50);
  }
  if(AC.state==='suspended'&&!paused)AC.resume();
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(t,type,freq,dur,vol,dest,o){o=o||{};const os=AC.createOscillator();if(type==='pulse')os.setPeriodicWave(pulseWave);else os.type=type;
  os.frequency.setValueAtTime(freq,t);if(o.slideTo)os.frequency.exponentialRampToValueAtTime(o.slideTo,t+dur);
  const g=AC.createGain(),a=o.a||0.004;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+a);g.gain.setValueAtTime(vol,t+Math.max(a,dur*(o.sus||0.6)));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=os;if(o.filter){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=o.filter;os.connect(f);node=f;}
  node.connect(g);g.connect(dest);os.start(t);os.stop(t+dur+0.03);
  if(o.vib){const l=AC.createOscillator();l.frequency.value=6;const lg=AC.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(freq*0.012,t+Math.min(dur,0.25));l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+0.03);}
}
function noiseHit(t,dur,vol,type,freq,dest,q){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);return f;}
function kick(t){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);const g=AC.createGain();g.gain.setValueAtTime(0.95,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+0.22);}

  [f0,f0*1.4983,f0*2].forEach((fr,i)=>{const o=AC.createOscillator();o.type='square';o.frequency.value=fr;o.detune.value=(i-1)*7;o.connect(pre);o.start(t);o.stop(t+dur+0.03);});
  pre.connect(sh);sh.connect(f);f.connect(g);g.connect(musicBus);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
const mi=[0,3,7],ma=[0,4,7];
const CH=[[{r:45,q:mi},{r:41,q:ma},{r:43,q:ma},{r:40,q:ma}],[{r:38,q:mi},{r:45,q:mi},{r:41,q:ma},{r:40,q:ma}]];
const MEL=[
 [[69,-1,72,74,76,-1,74,72],[72,-1,69,-1,77,76,74,72],[74,-1,71,74,79,-1,77,74],[76,-1,74,72,71,-1,68,71]],
 [[69,-1,72,74,76,-1,79,81],[77,-1,76,-1,72,-1,69,72],[74,76,77,-1,79,-1,77,74],[76,-1,-1,-1,80,-1,83,-1]],
 [[81,-1,79,77,76,-1,74,-1],[72,74,76,-1,69,-1,0,69],[72,-1,77,-1,81,-1,79,77],[76,-1,-1,74,76,-1,80,-1]],
 [[86,-1,84,81,77,-1,81,-1],[84,-1,81,76,72,-1,76,-1],[77,-1,81,-1,84,-1,86,84],[83,-1,80,-1,76,-1,71,68]]];
const GPAT=[2,0,1,1,0,2,1,0,2,0,1,1,0,1,2,1],BPAT=[0,0,12,0,0,12,0,12];
function sched(){if(!AC||paused)return;if(nextT<AC.currentTime)nextT=AC.currentTime+0.05;while(nextT<AC.currentTime+0.12){if(musicOn)playStep(mStep,nextT);nextT+=STEP;mStep++;}}
function playStep(s,t){
  const bar=Math.floor(s/16)%16,s16=s%16,sec=Math.floor(bar/4),bi=bar%4,ch=CH[sec<2?0:1][bi];
  if(s16===0||s16===8||(s16===10&&bi%2)||(s16===3&&bi===2))kick(t);
  const fill=bi===3&&sec%2===1&&s16>=12;
  if(s16===4||s16===12||fill)snare(t,fill&&s16!==12?0.6+(s16-12)*0.15:1);
  if(s16%2===0&&!fill)hat(t,s16===14);
  if(s16%2===0){const m=ch.r+BPAT[s16/2];tone(t,'square',mf(m),STEP*1.7,0.12,musicBus,{filter:900,sus:0.5});tone(t,'triangle',mf(m),STEP*1.8,0.28,musicBus);}
  const p=GPAT[s16];if(p)guitar(t,mf(ch.r+12),p===2?STEP*2.4:STEP*0.8,(p===2?0.15:0.1)*(sec<2?0.8:1));
  if(s16%2===0){const mel=MEL[sec][bi],i=s16/2,v=mel[i];if(v>0){let h=1;while(i+h<8&&mel[i+h]===-1)h++;tone(t,'pulse',mf(v),STEP*2*h*0.95,0.12,leadIn,{vib:h>=2,sus:0.75});}}
  if(sec>=2){const q=ch.q,nn=ch.r+24+q[s16%3]+(s16%6>=3?12:0);tone(t,'triangle',mf(nn),STEP*0.9,0.05,musicBus);}
}
function engine(spd,on,gas){if(!AC)return;const t=AC.currentTime;engOsc.frequency.setTargetAtTime(38+spd*105+(gas?8:0),t,0.08);engOsc2.frequency.setTargetAtTime((38+spd*105)*0.5,t,0.08);engFilt.frequency.setTargetAtTime(300+spd*900,t,0.1);engGain.gain.setTargetAtTime(on?0.05+spd*0.03:0,t,0.1);}

// On Android: phone TTS renders each phrase to a clip, which we push through an "angry shout" FX chain.
const VOICE={map:new Map(),ids:[],buf:{},asked:false,active:[],chain:null,lfo:null};
const clipMode=()=>!!(window.Android&&window.Android.synth&&AC);
function lineSegs(t){const out=[];for(const p of t.toLowerCase().split(/([a-z]*\*+[a-z*]*)/)){if(!p)continue;if(p.indexOf('*')>=0)out.push(null);else{const c=p.replace(/[^a-z0-9' ,.!?-]/g,'').trim();if(/[a-z0-9]/.test(c))out.push(c);}}return out;}
function voiceId(seg){let id=VOICE.map.get(seg);if(id===undefined){id='s'+VOICE.ids.length;VOICE.ids.push(seg);VOICE.map.set(seg,id);}return id;}
function preloadVoice(){if(VOICE.asked||!clipMode())return;VOICE.asked=true;
  for(const k in LINES)for(const line of LINES[k])for(const seg of lineSegs(line))if(seg){const fresh=!VOICE.map.has(seg);const id=voiceId(seg);if(fresh)try{window.Android.synth(id,seg)}catch(e){}}}

function trimClip(ab){const d=ab.getChannelData(0),thr=0.015;let a=0,b=d.length-1;while(a<b&&Math.abs(d[a])<thr)a++;while(b>a&&Math.abs(d[b])<thr)b--;

function voiceChain(){if(VOICE.chain)return VOICE.chain;

  const pres=AC.createBiquadFilter();pres.type='peaking';pres.frequency.value=1900;pres.Q.value=0.9;pres.gain.value=10;   // shouty mids
  const nasal=AC.createBiquadFilter();nasal.type='peaking';nasal.frequency.value=900;nasal.Q.value=1.2;nasal.gain.value=4;
  inp.connect(hp);hp.connect(pres);pres.connect(nasal);
  const drive=AC.createGain();drive.gain.value=3.2;const sh=AC.createWaveShaper();const c=new Float32Array(2048);for(let i=0;i<2048;i++){const x=i/1024-1;c[i]=Math.tanh(x*3.5);}sh.curve=c;sh.oversample='4x';
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;const wet=AC.createGain();wet.gain.value=0.55;
  nasal.connect(drive);drive.connect(sh);sh.connect(lp);lp.connect(wet);           // gritty, strained-throat layer
  const dry=AC.createGain();dry.gain.value=0.6;nasal.connect(dry);                 // clean layer keeps it understandable
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-26;comp.knee.value=4;comp.ratio.value=10;comp.attack.value=0.002;comp.release.value=0.08;
  const out=AC.createGain();out.gain.value=1.7;wet.connect(comp);dry.connect(comp);comp.connect(out);out.connect(sfxBus);
  const lfo=AC.createOscillator();lfo.frequency.value=7.5;const lg=AC.createGain();lg.gain.value=28;lfo.connect(lg);lfo.start();VOICE.lfo=lg; // rage tremble (cents)
  VOICE.chain=inp;return inp;}
function bleep(t,d){tone(t,'sine',1000,d,0.28,sfxBus,{a:0.004,sus:0.97});}
function playClipLine(t){const segs=lineSegs(t);if(!segs.length)return false;for(const g of segs)if(g&&!VOICE.buf[voiceId(g)])return false;
  stopClips();const inp=voiceChain();let when=AC.currentTime+0.03;const r0=rand(1.1,1.2),n=segs.length;
  segs.forEach((g,i)=>{
    if(g===null){bleep(when,0.34);when+=0.36;return;}
    const b=VOICE.buf[voiceId(g)],r=r0*(1+i*0.04),dur=b.duration/r;
    for(const dbl of [0,1]){const src=AC.createBufferSource();src.buffer=b;src.playbackRate.setValueAtTime(r,when);
      if(i===n-1)src.playbackRate.linearRampToValueAtTime(r*1.13,when+dur);             // voice cracks up at the end
      src.detune.value=dbl?-38:0;VOICE.lfo.connect(src.detune);
      const g2=AC.createGain();g2.gain.value=dbl?0.38:1;src.connect(g2);g2.connect(inp);src.start(when+(dbl?0.022:0));VOICE.active.push(src);}
    when+=dur-0.02;});
  if(musicBus&&musicOn){const now=AC.currentTime;musicBus.gain.cancelScheduledValues(now);musicBus.gain.setTargetAtTime(0.22,now,0.03);musicBus.gain.setTargetAtTime(0.5,when,0.15);}
  return true;}
function stopClips(){for(const s of VOICE.active)try{s.stop()}catch(e){}VOICE.active=[];}
function speak(t){if(!voiceOn||state==='title')return;
  if(clipMode()){preloadVoice();if(playClipLine(t))return;}
  const s=t.toLowerCase().replace(/[a-z]*\*+[a-z*]*/g,'bleep').replace(/!+/g,'!');
  try{if(window.Android&&window.Android.speak){window.Android.speak(s);return;}
    if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.pitch=0.5;u.rate=1.3;u.volume=1;u.lang='en-GB';speechSynthesis.speak(u);}}catch(e){}}
function stopSpeech(){stopClips();try{if(window.Android&&window.Android.stop)window.Android.stop();else if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}

// ================= input =================
function setControls(on){$('ctl').style.display=on?'block':'none';if(!on){tch.l=tch.r=tch.gas=tch.brake=false;document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));steerPts.clear();}}
const steerEl=$('steer'),steerPts=new Map();
function inBtn(p,el){const r=el.getBoundingClientRect(),pad=r.width*0.08;return p[0]>=r.left-pad&&p[0]<=r.right+pad&&p[1]>=r.top-pad&&p[1]<=r.bottom+pad;}
function updSteer(){let l=false,rr_=false;const LA=$('la'),RA=$('ra');for(const p of steerPts.values()){if(inBtn(p,LA))l=true;else if(inBtn(p,RA))rr_=true;}tch.l=l;tch.r=rr_;$('la').classList.toggle('on',l);$('ra').classList.toggle('on',rr_);}
steerEl.addEventListener('pointerdown',e=>{e.preventDefault();try{steerEl.setPointerCapture(e.pointerId)}catch(_){}steerPts.set(e.pointerId,[e.clientX,e.clientY]);updSteer();ensureAudio();});
steerEl.addEventListener('pointermove',e=>{if(steerPts.has(e.pointerId)){steerPts.set(e.pointerId,[e.clientX,e.clientY]);updSteer();}});
['pointerup','pointercancel'].forEach(ev=>steerEl.addEventListener(ev,e=>{steerPts.delete(e.pointerId);updSteer();}));
function hold(id,key){const el=$(id);const on=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}tch[key]=true;el.classList.add('on');ensureAudio();};const off=e=>{tch[key]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);}
hold('gas','gas');hold('brake','brake');
$('horn').addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();$('horn').classList.add('on');honk();setTimeout(()=>$('horn').classList.remove('on'),200);});
function refreshTog(){$('mus').classList.toggle('off',!musicOn);$('voi').classList.toggle('off',!voiceOn);}
$('mus').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ensureAudio();musicOn=!musicOn;store.set('abm_music',musicOn?'1':'0');if(musicBus)musicBus.gain.setTargetAtTime(musicOn?0.5:0,AC.currentTime,0.05);refreshTog();});
$('voi').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();voiceOn=!voiceOn;store.set('abm_voice',voiceOn?'1':'0');if(!voiceOn)stopSpeech();refreshTog();});
refreshTog();
function goFull(){if(window.Android)return;try{const d=document.documentElement;const r=d.requestFullscreen||d.webkitRequestFullscreen;if(r&&!document.fullscreenElement){const pr=r.call(d);const lock=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};if(pr&&pr.then)pr.then(lock).catch(()=>{});else lock();}}catch(e){}}
function startGame(){goFull();newGame();state='play';setControls(true);showMsg('GET PAST HIM!',2);bike.shoutT=1.5;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();
  if(paused){paused=false;if(AC)AC.resume();return;}
  if(state==='title')startGame();else if(state==='over'&&G.overT>1){startGame();}});
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake'};
addEventListener('keydown',e=>{ensureAudio();if(KM[e.code]){kb[KM[e.code]]=true;e.preventDefault();}
  if(e.code==='Space'||e.code==='KeyH'){e.preventDefault();if(state==='play')honk();else if(state==='title'||(state==='over'&&G.overT>1))startGame();}
  if(e.code==='Enter'&&(state==='title'||(state==='over'&&G.overT>1)))startGame();});
addEventListener('keyup',e=>{if(KM[e.code])kb[KM[e.code]]=false;});
function appPause(){if(state==='play'||state==='crash')paused=true;stopSpeech();if(AC)AC.suspend();}
function appResume(){if(AC&&!paused)AC.resume();}
window.onAppPause=appPause;window.onAppResume=appResume;
document.addEventListener('visibilitychange',()=>{if(document.hidden)appPause();else appResume();});

// ================= loop =================
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(!paused)update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body></html>
